[project]
name = "spectracoustic-analysis-nicegui"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "tdinapoli", email = "tomas.dina98@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
spectracoustic-analysis-nicegui = "spectracoustic_analysis_nicegui:main"

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "win-64", "osx-arm64"]

[tool.pixi.dependencies]
nicegui = "*"

[tool.pixi.pypi-dependencies]
spectracoustic-analysis-nicegui = { path = ".", editable = true }
spectracoustic-analysis = { path = "../analysis", editable = true }

[tool.pixi.tasks]
pack = 'python tools/build_pack.py'
upload = {args = [{default="spectracoustic-analysis-nicegui-0.1.0-win-64.ps1",arg="filename"}], cmd = "curl -u \"xi95ExZ8N6KWxY3:0000\" -T dist/{{filename}} https://uni-muenster.sciebo.de/public.php/webdav/{{filename}}"}
post = { depends-on=["pack", "upload"]}
gui = "python src/spectracoustic_gui/gui.py"
